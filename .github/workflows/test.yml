name: test

# ./run test --container on a clean Linux machine: the link and import checks, every SDK and demo suite, gofmt,
# go vet, staticcheck and the jar check, with the toolchains the container pins (poc-sdks/scripts/test.Dockerfile),
# not whatever the runner has. The same command runs locally and needs only Docker and git. No model. The
# checkout action is pinned to the commit of the release its comment names, so a moved tag cannot change what runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ./run test --container
        run: ./run test --container
