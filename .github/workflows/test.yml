name: test

# ./run test on a clean Linux machine: the link and import checks, every SDK and demo suite, gofmt, go vet,
# staticcheck and the jar check. No Docker and no model. The toolchains are the floors ./run accepts. Each action
# is pinned to the commit of the release its comment names, so a moved tag cannot change what runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: poc-sdks/go/go.mod
          check-latest: true
          cache-dependency-path: poc-demos/envoy-gateway/processor/go.sum

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: ./run test
        run: ./run test
