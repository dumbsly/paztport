name: test

# ./run test on a clean Linux machine: the link and import checks, every SDK and demo suite, gofmt, go vet,
# staticcheck and the jar check. No Docker and no model. The toolchains are the floors ./run accepts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-go@v7
        with:
          go-version-file: poc-sdks/go/go.mod
          check-latest: true
          cache-dependency-path: poc-demos/envoy-gateway/processor/go.sum

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: ./run test
        run: ./run test
