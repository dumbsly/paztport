server:
  port: 8080

quarantine:
  threshold: ${QUARANTINE_THRESHOLD:3}
  window-ms: ${QUARANTINE_WINDOW_MS:60000}
  max-per-svc: ${QUARANTINE_MAX_PER_SVC:2}
  svc-window-ms: ${QUARANTINE_SVC_WINDOW_MS:600000}
  mesh-network: ${MESH_NETWORK:paztport-mesh}
  quarantine-network: ${QUARANTINE_NETWORK:paztport-quarantine}

responder:
  keyring-path: ${PAZTPORT_KEYRING_PATH:/config/keys/keyring.json}
  allowed-signers: ${RESPONDER_ALLOWED_SIGNERS:payment}
