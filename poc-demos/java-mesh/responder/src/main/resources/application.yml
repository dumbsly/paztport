server:
  port: 8080
  # On SIGTERM the drain module first serves with Connection: close for demo.drain-seconds (DEMO_DRAIN_SECONDS,
  # default 5), then this graceful shutdown lets requests in progress finish, up to the timeout below. The drain is
  # not bounded by that timeout; keep it well under the pods' termination grace.
  shutdown: graceful
  # Mutual TLS, like the mesh services: only a holder of a mesh CA certificate
  # gets as far as the event endpoint, which still checks the event's signature.
  ssl:
    bundle: mesh
    client-auth: need

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  ssl:
    bundle:
      pem:
        mesh:
          keystore:
            certificate: file:/config/tls/responder.crt
            private-key: file:/config/tls/responder.key
          truststore:
            certificate: file:/config/tls/ca.crt

quarantine:
  threshold: ${QUARANTINE_THRESHOLD:3}
  window-ms: ${QUARANTINE_WINDOW_MS:60000}
  max-per-svc: ${QUARANTINE_MAX_PER_SVC:2}
  svc-window-ms: ${QUARANTINE_SVC_WINDOW_MS:600000}
  mesh-network: ${MESH_NETWORK:paztport-mesh}
  quarantine-network: ${QUARANTINE_NETWORK:paztport-quarantine}

responder:
  keyring-path: ${PAZTPORT_KEYRING_PATH:/config/keys/keyring.json}
  allowed-signers: ${RESPONDER_ALLOWED_SIGNERS:payment}
