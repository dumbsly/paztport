server:
  port: 8080
  # Mutual TLS with the shop: its callers present certificates from the shop's
  # CA, which is all this bundle trusts, and the filter takes the service the
  # certificate names as the peer whose session a call is in.
  ssl:
    bundle: psp
    client-auth: need

spring:
  ssl:
    bundle:
      pem:
        psp:
          keystore:
            certificate: file:/config/tls/psp.crt
            private-key: file:/config/tls/psp.key
          truststore:
            certificate: file:/config/tls/shop-ca.crt

paztport:
  service-name: psp
  # Required wherever the trust material is set. At a partner it checks only
  # the responses to the service's own calls, and the PSP calls nobody, so it
  # names the PSP itself; who may start a chain in a session is
  # partner.client-origins, below.
  origins: ${PAZTPORT_ORIGINS:psp}
  # The demo's opening check, under /debug, is not a call in a session.
  unverified-paths: ${PAZTPORT_UNVERIFIED_PATHS:/debug}
  # The demo's record of what each call carried, and its check of the shop's
  # openings against it (PAZTPORT_OPENINGS).
  openings: ${PAZTPORT_OPENINGS:false}
  # The shop's entry here. Its own keyring, root and policy pin, its own key
  # (which signs session replies) and the policy key's reply certificate for
  # it, and the shop's pinned policy key, are supplied by the environment in
  # docker-compose (PAZTPORT_KEYRING_PATH, PAZTPORT_ROOT_PATH,
  # PAZTPORT_POLICY_KEY_PATH, PAZTPORT_KEY_PATH,
  # PAZTPORT_PARTNER_REPLY_CERT_PATH and
  # PAZTPORT_PARTNER_CLIENT_POLICY_KEY_PATHS), as payment's key-path is. The
  # policy private key is not among them.
  partner:
    enabled: true
    # Only the shop's egress may start a chain in its attested session.
    client-origins: [payment]
    # A refund is a public write, so an unsafe session, which carries no
    # influence to judge it by, may not make one.
    unsafe-disabled: ["POST /refund"]
