server:
  port: 8080
  # On SIGTERM the drain module first serves with Connection: close for demo.drain-seconds (DEMO_DRAIN_SECONDS,
  # default 5), then this graceful shutdown lets requests in progress finish, up to the timeout below. The drain is
  # not bounded by that timeout; keep it well under the pods' termination grace.
  shutdown: graceful
  # Mutual TLS: every caller presents a certificate from the mesh CA, and the
  # filter takes the service it names as the sender.
  ssl:
    bundle: mesh
    client-auth: need

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  ssl:
    bundle:
      pem:
        mesh:
          keystore:
            certificate: file:/config/tls/gateway.crt
            private-key: file:/config/tls/gateway.key
          truststore:
            certificate: file:/config/tls/ca.crt

paztport:
  service-name: gateway
  origin: true
  key-path: ${PAZTPORT_KEY_PATH:/config/keys/gateway.key}
  proofs-path: ${PAZTPORT_PROOFS_PATH:/config/policy/proofs-gateway.json}
  # The keyring, root and pin check the responses gateway gets back.
  keyring-path: ${PAZTPORT_KEYRING_PATH:/config/keys/keyring.json}
  root-path: ${PAZTPORT_ROOT_PATH:/config/policy/root.json}
  policy-key-path: ${PAZTPORT_POLICY_KEY_PATH:/config/keys/policy.pub}
  # Who may start a chain, and the paths the filter leaves unverified.
  origins: ${PAZTPORT_ORIGINS:gateway}
  unverified-paths: ${PAZTPORT_UNVERIFIED_PATHS:}
  tls-bundle: mesh

downstream:
  orders-url: ${ORDERS_URL:https://orders:8080}
  search-url: ${SEARCH_URL:https://search:8080}
  tickets-url: ${TICKETS_URL:https://tickets:8080}

# The demo's customers, each logged in with a fixed bearer token.
demo:
  tokens:
    alice-token: alice
    mallory-token: mallory
