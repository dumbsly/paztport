server:
  port: 8080
  # Mutual TLS: every caller presents a certificate from the mesh CA, and the
  # filter takes the service it names as the sender.
  ssl:
    bundle: mesh
    client-auth: need

spring:
  ssl:
    bundle:
      pem:
        mesh:
          keystore:
            certificate: file:/config/tls/tickets.crt
            private-key: file:/config/tls/tickets.key
          truststore:
            certificate: file:/config/tls/ca.crt

paztport:
  service-name: tickets
  # Every request is verified, and refused unless it verifies, so a ticket
  # reaches the assistant only on a chain the gateway started.
  verify: true
  mode: enforce
  admin-token: ${PAZTPORT_ADMIN_TOKEN:}
  key-path: ${PAZTPORT_KEY_PATH:/config/keys/tickets.key}
  proofs-path: ${PAZTPORT_PROOFS_PATH:/config/policy/proofs-tickets.json}
  # The keyring, root and pin check the requests tickets gets and the responses it gets back.
  keyring-path: ${PAZTPORT_KEYRING_PATH:/config/keys/keyring.json}
  root-path: ${PAZTPORT_ROOT_PATH:/config/policy/root.json}
  policy-key-path: ${PAZTPORT_POLICY_KEY_PATH:/config/keys/policy.pub}
  # Who may start a chain, and the paths the filter leaves unverified.
  origins: ${PAZTPORT_ORIGINS:gateway}
  unverified-paths: ${PAZTPORT_UNVERIFIED_PATHS:/admin,/debug,/actuator}
  tls-bundle: mesh

downstream:
  assistant-url: ${ASSISTANT_URL:https://assistant:8080}
