server:
  port: 8080

paztport:
  service-name: payment
  verify: true
  mode: ${PAZTPORT_MODE:enforce}
  admin-token: ${PAZTPORT_ADMIN_TOKEN:}
  event-key-path: ${PAZTPORT_EVENT_KEY_PATH:}
  capture: ${PAZTPORT_CAPTURE:false}
  keyring-path: ${PAZTPORT_KEYRING_PATH:/config/keys/keyring.json}
  root-path: ${PAZTPORT_ROOT_PATH:/config/policy/root.json}
  max-age-ms: ${PAZTPORT_MAX_AGE_MS:5000}
  origins: ${PAZTPORT_ORIGINS:gateway}
  responder-url: ${RESPONDER_URL:}
