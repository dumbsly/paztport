server:
  port: 8080
  # On SIGTERM the drain module first serves with Connection: close for demo.drain-seconds (DEMO_DRAIN_SECONDS,
  # default 5), then this graceful shutdown lets requests in progress finish, each phase up to the timeout below.
  shutdown: graceful
  # Mutual TLS: every caller presents a certificate from the mesh CA, and the
  # filter takes the service it names as the sender.
  ssl:
    bundle: mesh
    client-auth: need

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  ssl:
    bundle:
      pem:
        mesh:
          keystore:
            certificate: file:/config/tls/payment.crt
            private-key: file:/config/tls/payment.key
          truststore:
            certificate: file:/config/tls/ca.crt
        # Presented to the PSP, another organisation: the same certificate,
        # but only the PSP's CA is trusted, and only on calls to the PSP.
        psp:
          keystore:
            certificate: file:/config/tls/payment.crt
            private-key: file:/config/tls/payment.key
          truststore:
            certificate: file:/config/partner/psp-ca.crt

paztport:
  service-name: payment
  verify: true
  mode: ${PAZTPORT_MODE:enforce}
  admin-token: ${PAZTPORT_ADMIN_TOKEN:}
  event-key-path: ${PAZTPORT_EVENT_KEY_PATH:}
  capture: ${PAZTPORT_CAPTURE:false}
  openings: ${PAZTPORT_OPENINGS:false}
  # key-path (which attests payment's responses) and policy-key-path are
  # supplied by the environment in docker-compose (PAZTPORT_KEY_PATH /
  # PAZTPORT_POLICY_KEY_PATH) so the boot tests can run without mounted files.
  # So are proofs-path and boundary.*, which make payment the egress to the
  # PSP (PAZTPORT_PROOFS_PATH, PAZTPORT_BOUNDARY_*).
  keyring-path: ${PAZTPORT_KEYRING_PATH:/config/keys/keyring.json}
  root-path: ${PAZTPORT_ROOT_PATH:/config/policy/root.json}
  max-age-ms: ${PAZTPORT_MAX_AGE_MS:5000}
  origins: ${PAZTPORT_ORIGINS:gateway}
  # The control plane and the demo harness: the mode switch, the capture and opening endpoints, actuator.
  unverified-paths: ${PAZTPORT_UNVERIFIED_PATHS:/admin,/debug,/actuator}
  responder-url: ${RESPONDER_URL:}
  tls-bundle: mesh
