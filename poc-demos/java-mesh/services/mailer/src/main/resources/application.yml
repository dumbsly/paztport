server:
  port: 8080
  # Mutual TLS: every caller presents a certificate from the mesh CA, and the
  # filter takes the service it names as the sender.
  ssl:
    bundle: mesh
    client-auth: need

spring:
  ssl:
    bundle:
      pem:
        mesh:
          keystore:
            certificate: file:/config/tls/mailer.crt
            private-key: file:/config/tls/mailer.key
          truststore:
            certificate: file:/config/tls/ca.crt

paztport:
  service-name: mailer
  # Every request is verified, and refused unless it verifies: the rule judges
  # an email by the influence the request carries, so that influence must be
  # the one its chain committed to.
  verify: true
  mode: enforce
  admin-token: ${PAZTPORT_ADMIN_TOKEN:}
  # The stamp key attests what the mailer answers; it calls nobody, so it has no proofs.
  key-path: ${PAZTPORT_KEY_PATH:/config/keys/mailer.key}
  keyring-path: ${PAZTPORT_KEYRING_PATH:/config/keys/keyring.json}
  root-path: ${PAZTPORT_ROOT_PATH:/config/policy/root.json}
  policy-key-path: ${PAZTPORT_POLICY_KEY_PATH:/config/keys/policy.pub}
  # Who may start a chain, and the paths the filter leaves unverified.
  origins: ${PAZTPORT_ORIGINS:gateway}
  unverified-paths: ${PAZTPORT_UNVERIFIED_PATHS:/admin}
  tls-bundle: mesh

# The mailer's directory: whose each address is. Bracketed, so the keys keep
# their dots. Lookups trim and lower-case the address first.
mailer:
  recipients:
    "[alice@shop.example]": alice
    "[mallory@mail.example]": mallory
