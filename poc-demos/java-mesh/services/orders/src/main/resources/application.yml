server:
  port: 8080
  # Mutual TLS: every caller presents a certificate from the mesh CA, and the
  # filter takes the service it names as the sender.
  ssl:
    bundle: mesh
    client-auth: need

spring:
  ssl:
    bundle:
      pem:
        mesh:
          keystore:
            certificate: file:/config/tls/orders.crt
            private-key: file:/config/tls/orders.key
          truststore:
            certificate: file:/config/tls/ca.crt

paztport:
  service-name: orders
  key-path: ${PAZTPORT_KEY_PATH:/config/keys/orders.key}
  proofs-path: ${PAZTPORT_PROOFS_PATH:/config/policy/proofs-orders.json}
  # The keyring, root and pin check the responses orders gets back.
  keyring-path: ${PAZTPORT_KEYRING_PATH:/config/keys/keyring.json}
  root-path: ${PAZTPORT_ROOT_PATH:/config/policy/root.json}
  policy-key-path: ${PAZTPORT_POLICY_KEY_PATH:/config/keys/policy.pub}
  # Who may start a chain, and the paths the filter leaves unverified.
  origins: ${PAZTPORT_ORIGINS:gateway}
  unverified-paths: ${PAZTPORT_UNVERIFIED_PATHS:/actuator}
  tls-bundle: mesh

downstream:
  payment-url: ${PAYMENT_URL:https://payment:8080}
