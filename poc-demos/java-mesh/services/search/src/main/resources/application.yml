server:
  port: 8080

paztport:
  service-name: search
  # key-path and proofs-path are supplied by the environment in docker-compose
  # (PAZTPORT_KEY_PATH / PAZTPORT_PROOFS_PATH) so the boot test can run
  # without mounted files.

downstream:
  payment-url: ${PAYMENT_URL:http://payment:8080}

attack:
  enabled: ${ATTACK_MODE:false}
