server:
  port: 8080
  # Mutual TLS: every caller presents a certificate from the mesh CA, and the
  # filter takes the service it names as the sender.
  ssl:
    bundle: mesh
    client-auth: need

spring:
  ssl:
    bundle:
      pem:
        mesh:
          keystore:
            certificate: file:/config/tls/search.crt
            private-key: file:/config/tls/search.key
          truststore:
            certificate: file:/config/tls/ca.crt

paztport:
  service-name: search
  # key-path, proofs-path, keyring-path, root-path and policy-key-path are
  # supplied by the environment in docker-compose (PAZTPORT_KEY_PATH,
  # PAZTPORT_PROOFS_PATH, ...) so the boot test can run without mounted files.
  # Who may start a chain, and the paths the filter leaves unverified.
  origins: ${PAZTPORT_ORIGINS:gateway}
  unverified-paths: ${PAZTPORT_UNVERIFIED_PATHS:/admin,/debug,/actuator}
  tls-bundle: mesh

downstream:
  payment-url: ${PAYMENT_URL:https://payment:8080}

attack:
  enabled: ${ATTACK_MODE:false}
