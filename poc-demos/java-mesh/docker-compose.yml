# Paztport local POC.
#
#   (cd ../../poc-sdks/java && mvn -q install -DskipTests)   # SDK jars and the tool images' jars
#   mvn -q package -DskipTests
#   docker compose run --rm keygen
#   docker compose run --rm keygen-psp
#   docker compose run --rm policy-tool
#   docker compose run --rm policy-tool-psp
#   docker compose up -d --build
#
# The policy tools sign the root and re-sign the keyring for PAZTPORT_POLICY_DAYS
# days (default 7), and a service refuses to start once either has expired. To
# keep them current without changing the routes, renew rather than rebuild: the
# tree and the proofs are kept, so the services may restart in any order, even
# one at a time. They read the files at startup, so restart them to load the
# renewed ones.
#
#   docker compose run --rm -e PAZTPORT_RENEW=true policy-tool
#   docker compose run --rm -e PAZTPORT_RENEW=true policy-tool-psp
#   docker compose restart
#
# Least knowledge is enforced by the volume mounts: each service bind-mounts
# only the specific files its role needs, never a directory of keys. Every
# service gets its own TLS certificate and key and the CA certificate, since
# every hop is mutual TLS. Callers see their own stamp key and their own proofs,
# plus the public keyring, the signed root and the policy pin (policy.pub) to
# check the responses they get back, and, for orders and search, the chains of
# the requests they answer: a hop attests only a chain it verified, and gateway,
# the origin, never attests. Tickets, the assistant and the mailer verify every
# request, with the same public files; the mailer calls nobody, so it holds a
# stamp key (to attest its answers) and no proofs. Payment sees the same public files to
# verify requests, and its own stamp key, which attests its responses and signs
# the events it sends the responder. The CA's private key (out/keys/ca/ca.key)
# is mounted nowhere. The policy tools mount the policy key and keyring.json, each
# as a single file, and never the keys directory, which holds every service's key;
# of the containers that read the keyring, only the policy tools may write it,
# because they re-sign it in place. The keygens, which write the keys, mount the
# keys directory writable, and run only when the keys are made.
#
# The PSP is another organisation, with its own keys (out/psp-keys), its own CA
# and its own root (out/psp-policy), on its own network. Payment, the shop's
# egress, is the one service on both networks. It holds the PSP's policy pin and
# CA certificate, and its proofs for the boundary route payment->psp; the PSP
# holds the shop's policy pin and CA certificate, and its own key, psp.key,
# which signs its session replies under a reply certificate from its policy key
# (out/psp-policy/reply-cert.json, reissued by each policy-tool-psp run). Its
# policy private key is mounted only into policy-tool-psp. Neither sees the
# other's routes or keys.
#
# The six services a support ticket passes through (gateway, tickets,
# assistant, orders, payment, mailer) allow a request tree 30 s from the
# gateway's stamp (PAZTPORT_RUN_MAX_AGE_MS): five hops started cold can take
# longer than 5 s. Each stamp is still refused once it is 5 s old.
#
# Orders and payment name their operations, so a route can name one
# (orders#getOrder). Each mounts its own operation table, which the policy tool
# copies to out/policy, and each caller mounts the tables of those it calls:
# gateway orders', the assistant both, orders payment's, and search payment's,
# which it uses only once the widened policy gives it that table's proof. The
# tables are set here only: the same jars run on their application.yml, as the
# Envoy Gateway demo runs them, stay service-level.
#
# The build context is the repository root, because the keygen and policy-tool
# jars are built under poc-sdks/java. The project name is pinned so container
# labels (and so the responder's service lookups) don't depend on this folder's name.

name: paztport

services:

  # --- one-shot tools (not started by `up`; run explicitly) ---

  keygen:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-sdks/java/tools/keygen/target/keygen.jar
    volumes:
      - ./out/keys:/out/keys
    command: ["/out/keys", "gateway", "orders", "payment", "search", "tickets", "assistant", "mailer", "--tls-only", "operator", "responder", "--org", "shop"]

  keygen-psp:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-sdks/java/tools/keygen/target/keygen.jar
    volumes:
      - ./out/psp-keys:/out/keys
    # One stamp key and one certificate, psp, from the PSP's own CA; no TLS-only names.
    command: ["/out/keys", "psp", "--tls-only", "--org", "psp"]

  policy-tool:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-sdks/java/tools/policy-tool/target/policy-tool.jar
    volumes:
      - ./policy:/policy:ro
      - ./out/keys/policy.key:/out/keys/policy.key:ro   # signs the root and the keyring
      - ./out/keys/keyring.json:/out/keys/keyring.json   # writable: re-signed in place on every run
      - ./out/policy:/out/policy
    command: ["/policy/paths.yaml", "/out/keys", "/out/policy"]

  policy-tool-psp:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-sdks/java/tools/policy-tool/target/policy-tool.jar
    environment:
      PAZTPORT_REPLY_CERT_SVC: psp   # also writes reply-cert.json, for psp's key, valid for 7 days
    volumes:
      - ./psp-policy:/policy:ro
      - ./out/psp-keys/policy.key:/out/keys/policy.key:ro   # signs the PSP's root, keyring and reply certificate
      - ./out/psp-keys/keyring.json:/out/keys/keyring.json   # writable: re-signed in place; names the key the certificate is for
      - ./out/psp-policy:/out/policy
    command: ["/policy/paths.yaml", "/out/keys", "/out/policy"]

  # --- the mesh ---

  payment:
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-demos/java-mesh/services/payment/target/payment.jar
    networks: [mesh, psp]   # the shop's egress: the one service that reaches the PSP
    environment:
      PAZTPORT_MODE: ${PAZTPORT_MODE:-enforce}
      PAZTPORT_RUN_MAX_AGE_MS: "30000"
      PAZTPORT_ADMIN_TOKEN: ${PAZTPORT_ADMIN_TOKEN:-}   # shared token for /admin/mode; the demo generates one per run
      PAZTPORT_CAPTURE: "true"   # demo harness: lets the attacker replay a real request
      PAZTPORT_OPENINGS: "true"   # demo stand-in: keeps what each blinded entry sent the PSP stood for
      PAZTPORT_KEY_PATH: /config/keys/payment.key   # attests payment's responses
      PAZTPORT_POLICY_KEY_PATH: /config/keys/policy.pub
      PAZTPORT_EVENT_KEY_PATH: /config/keys/payment.key   # signs events; read only when RESPONDER_URL is set
      RESPONDER_URL: ${RESPONDER_URL:-}   # empty = log only; the demo sets it for the quarantine scenarios
      # The egress to the PSP: boundary stamps are signed with payment.key and prove the route payment->psp.
      PAZTPORT_PROOFS_PATH: /config/policy/proofs-payment.json
      PAZTPORT_BOUNDARY_PARTNER: psp
      PAZTPORT_BOUNDARY_URL: https://psp:8080
      PAZTPORT_BOUNDARY_TLS_BUNDLE: psp
      PAZTPORT_BOUNDARY_PARTNER_POLICY_KEY_PATH: /config/partner/psp-policy.pub
      PAZTPORT_BOUNDARY_BLINDING_KEY_PATH: /config/keys/boundary.key   # salts the influence sent to the PSP
      PAZTPORT_OPERATIONS_TABLEPATH: /config/policy/ops-payment.json   # confirms the operation each request reaches
    volumes:
      - ./out/keys/keyring.json:/config/keys/keyring.json:ro
      - ./out/keys/policy.pub:/config/keys/policy.pub:ro
      - ./out/keys/payment.key:/config/keys/payment.key:ro   # response attestation, event and boundary signing
      - ./out/keys/boundary.key:/config/keys/boundary.key:ro   # payment's alone: no other service mounts it
      - ./out/policy/root.json:/config/policy/root.json:ro
      - ./out/policy/proofs-payment.json:/config/policy/proofs-payment.json:ro
      - ./out/policy/ops-payment.json:/config/policy/ops-payment.json:ro
      - ./out/keys/tls/payment.crt:/config/tls/payment.crt:ro
      - ./out/keys/tls/payment.key:/config/tls/payment.key:ro
      - ./out/keys/tls/ca.crt:/config/tls/ca.crt:ro
      - ./out/psp-keys/policy.pub:/config/partner/psp-policy.pub:ro   # the PSP's pin: its session replies must verify
      - ./out/psp-keys/tls/ca.crt:/config/partner/psp-ca.crt:ro   # trusted on calls to the PSP only

  orders:
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-demos/java-mesh/services/orders/target/orders.jar
    networks: [mesh]
    environment:
      PAZTPORT_RUN_MAX_AGE_MS: "30000"
      PAZTPORT_OPERATIONS_TABLEPATH: /config/policy/ops-orders.json
      PAZTPORT_OPERATIONS_RECEIVERTABLES: /config/policy/ops-payment.json
      ATTACK_ENABLED: "true"   # demo harness: code in orders that steers its calls to payment (scenario 15)
    volumes:
      - ./out/keys/orders.key:/config/keys/orders.key:ro
      - ./out/policy/proofs-orders.json:/config/policy/proofs-orders.json:ro
      - ./out/policy/ops-orders.json:/config/policy/ops-orders.json:ro
      - ./out/policy/ops-payment.json:/config/policy/ops-payment.json:ro
      - ./out/keys/keyring.json:/config/keys/keyring.json:ro
      - ./out/keys/policy.pub:/config/keys/policy.pub:ro
      - ./out/policy/root.json:/config/policy/root.json:ro
      - ./out/keys/tls/orders.crt:/config/tls/orders.crt:ro
      - ./out/keys/tls/orders.key:/config/tls/orders.key:ro
      - ./out/keys/tls/ca.crt:/config/tls/ca.crt:ro
    depends_on: [payment]

  search:
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-demos/java-mesh/services/search/target/search.jar
    networks: [mesh]
    environment:
      ATTACK_MODE: "true"
      PAZTPORT_KEY_PATH: /config/keys/search.key
      PAZTPORT_PROOFS_PATH: /config/policy/proofs-search.json
      PAZTPORT_KEYRING_PATH: /config/keys/keyring.json
      PAZTPORT_ROOT_PATH: /config/policy/root.json
      PAZTPORT_POLICY_KEY_PATH: /config/keys/policy.pub
      # Covered only when search holds payment's table proof, which it does only with the route that widens the policy.
      PAZTPORT_OPERATIONS_RECEIVERTABLES: /config/policy/ops-payment.json
    volumes:
      - ./out/keys/search.key:/config/keys/search.key:ro
      - ./out/policy/proofs-search.json:/config/policy/proofs-search.json:ro
      - ./out/policy/ops-payment.json:/config/policy/ops-payment.json:ro
      - ./out/keys/keyring.json:/config/keys/keyring.json:ro
      - ./out/keys/policy.pub:/config/keys/policy.pub:ro
      - ./out/policy/root.json:/config/policy/root.json:ro
      - ./out/keys/tls/search.crt:/config/tls/search.crt:ro
      - ./out/keys/tls/search.key:/config/tls/search.key:ro
      - ./out/keys/tls/ca.crt:/config/tls/ca.crt:ro

  # --- the support desk: tickets, the assistant (scripted: no model) and the mailer ---

  mailer:
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-demos/java-mesh/services/mailer/target/mailer.jar
    networks: [mesh]
    environment:
      PAZTPORT_ADMIN_TOKEN: ${PAZTPORT_ADMIN_TOKEN:-}
      PAZTPORT_RUN_MAX_AGE_MS: "30000"
    volumes:
      - ./out/keys/mailer.key:/config/keys/mailer.key:ro
      - ./out/keys/keyring.json:/config/keys/keyring.json:ro
      - ./out/keys/policy.pub:/config/keys/policy.pub:ro
      - ./out/policy/root.json:/config/policy/root.json:ro
      - ./out/keys/tls/mailer.crt:/config/tls/mailer.crt:ro
      - ./out/keys/tls/mailer.key:/config/tls/mailer.key:ro
      - ./out/keys/tls/ca.crt:/config/tls/ca.crt:ro

  assistant:
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-demos/java-mesh/services/assistant/target/assistant.jar
    networks: [mesh]
    environment:
      PAZTPORT_ADMIN_TOKEN: ${PAZTPORT_ADMIN_TOKEN:-}
      PAZTPORT_RUN_MAX_AGE_MS: "30000"
      PAZTPORT_OPERATIONS_RECEIVERTABLES: /config/policy/ops-orders.json,/config/policy/ops-payment.json
    volumes:
      - ./out/keys/assistant.key:/config/keys/assistant.key:ro
      - ./out/policy/proofs-assistant.json:/config/policy/proofs-assistant.json:ro
      - ./out/policy/ops-orders.json:/config/policy/ops-orders.json:ro
      - ./out/policy/ops-payment.json:/config/policy/ops-payment.json:ro
      - ./out/keys/keyring.json:/config/keys/keyring.json:ro
      - ./out/keys/policy.pub:/config/keys/policy.pub:ro
      - ./out/policy/root.json:/config/policy/root.json:ro
      - ./out/keys/tls/assistant.crt:/config/tls/assistant.crt:ro
      - ./out/keys/tls/assistant.key:/config/tls/assistant.key:ro
      - ./out/keys/tls/ca.crt:/config/tls/ca.crt:ro
    depends_on: [orders, payment, mailer]

  tickets:
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-demos/java-mesh/services/tickets/target/tickets.jar
    networks: [mesh]
    environment:
      PAZTPORT_ADMIN_TOKEN: ${PAZTPORT_ADMIN_TOKEN:-}
      PAZTPORT_RUN_MAX_AGE_MS: "30000"
    volumes:
      - ./out/keys/tickets.key:/config/keys/tickets.key:ro
      - ./out/policy/proofs-tickets.json:/config/policy/proofs-tickets.json:ro
      - ./out/keys/keyring.json:/config/keys/keyring.json:ro
      - ./out/keys/policy.pub:/config/keys/policy.pub:ro
      - ./out/policy/root.json:/config/policy/root.json:ro
      - ./out/keys/tls/tickets.crt:/config/tls/tickets.crt:ro
      - ./out/keys/tls/tickets.key:/config/tls/tickets.key:ro
      - ./out/keys/tls/ca.crt:/config/tls/ca.crt:ro
    depends_on: [assistant]

  gateway:
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-demos/java-mesh/services/gateway/target/gateway.jar
    networks: [mesh]
    ports:
      - "8080:8080"
    environment:
      PAZTPORT_RUN_MAX_AGE_MS: "30000"
      PAZTPORT_OPERATIONS_RECEIVERTABLES: /config/policy/ops-orders.json
    volumes:
      - ./out/keys/gateway.key:/config/keys/gateway.key:ro
      - ./out/policy/proofs-gateway.json:/config/policy/proofs-gateway.json:ro
      - ./out/policy/ops-orders.json:/config/policy/ops-orders.json:ro
      - ./out/keys/keyring.json:/config/keys/keyring.json:ro
      - ./out/keys/policy.pub:/config/keys/policy.pub:ro
      - ./out/policy/root.json:/config/policy/root.json:ro
      - ./out/keys/tls/gateway.crt:/config/tls/gateway.crt:ro
      - ./out/keys/tls/gateway.key:/config/tls/gateway.key:ro
      - ./out/keys/tls/ca.crt:/config/tls/ca.crt:ro
    depends_on: [orders, search, tickets]

  # --- the PSP: another organisation ---

  psp:
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-demos/java-mesh/psp/target/psp.jar
    networks: [psp]
    environment:
      PAZTPORT_KEYRING_PATH: /config/keys/keyring.json
      PAZTPORT_ROOT_PATH: /config/policy/root.json
      PAZTPORT_POLICY_KEY_PATH: /config/keys/policy.pub
      PAZTPORT_KEY_PATH: /config/keys/psp.key
      PAZTPORT_PARTNER_REPLY_CERT_PATH: /config/policy/reply-cert.json
      PAZTPORT_PARTNER_CLIENT_POLICY_KEY_PATHS: /config/clients/shop-policy.pub
      PAZTPORT_OPENINGS: "true"   # demo stand-in: records what each call carried, to check the shop's openings
    volumes:
      - ./out/psp-keys/keyring.json:/config/keys/keyring.json:ro
      - ./out/psp-keys/policy.pub:/config/keys/policy.pub:ro
      - ./out/psp-keys/psp.key:/config/keys/psp.key:ro   # signs the PSP's session replies
      - ./out/psp-policy/root.json:/config/policy/root.json:ro
      - ./out/psp-policy/reply-cert.json:/config/policy/reply-cert.json:ro   # the policy key's certificate for psp.key
      - ./out/psp-keys/tls/psp.crt:/config/tls/psp.crt:ro
      - ./out/psp-keys/tls/psp.key:/config/tls/psp.key:ro
      - ./out/keys/tls/ca.crt:/config/tls/shop-ca.crt:ro   # the only CA the PSP trusts
      - ./out/keys/policy.pub:/config/clients/shop-policy.pub:ro   # the shop's pin: its sessions may be attested

  responder:
    build:
      context: ../..
      dockerfile: poc-demos/java-mesh/Dockerfile
      args:
        JAR: poc-demos/java-mesh/responder/target/responder.jar
    networks: [mesh]
    environment:
      MESH_NETWORK: paztport-mesh
      QUARANTINE_NETWORK: paztport-quarantine
      QUARANTINE_THRESHOLD: ${QUARANTINE_THRESHOLD:-3}
      QUARANTINE_MAX_PER_SVC: ${QUARANTINE_MAX_PER_SVC:-2}
    volumes:
      - ./out/keys/keyring.json:/config/keys/keyring.json:ro   # verifies event signatures
      - ./out/keys/tls/responder.crt:/config/tls/responder.crt:ro
      - ./out/keys/tls/responder.key:/config/tls/responder.key:ro
      - ./out/keys/tls/ca.crt:/config/tls/ca.crt:ro
      # Host-level control, acceptable for a local demo only (see README).
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  mesh:
    name: paztport-mesh
  quarantine:
    name: paztport-quarantine
    internal: true
  psp:
    name: paztport-psp
