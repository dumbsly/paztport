#
# The routes to orders, and their retries. envoy-gateway.sh applies them after the processor's chart, whose
# EnvoyExtensionPolicy already names them, so that Envoy never serves a route to orders without the processor; an
# operator adding a Paztport route does the same: the route in the chart's values first, then the route itself.

# The Paztport route: POST /orders, stamped by the edge for orders.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
  namespace: paztport
spec:
  parentRefs:
    - name: edge
  rules:
    - matches:
        - path: {type: PathPrefix, value: /orders}
      backendRefs:
        - {name: orders, port: 8080}
---
# A second route to orders, for the host unmapped.example, that the processor is attached to but its routes do not
# map: the processor refuses every request on it, and orders sees none.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-unmapped
  namespace: paztport
spec:
  parentRefs:
    - name: edge
  hostnames: [unmapped.example]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /orders}
      backendRefs:
        - {name: orders, port: 8080}
---
# Retries on the routes to orders only where the request never reached it: a connection that failed, or a stream it
# refused. Retrying anything it may have received would send it the same stamp twice.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: orders-retry
  namespace: paztport
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders-unmapped}
  retry:
    numRetries: 2
    retryOn:
      triggers: [connect-failure, refused-stream]
