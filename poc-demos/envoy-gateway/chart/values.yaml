#
# The edge's processor, attached to an existing Gateway's HTTPRoutes in the release's namespace.

# The name of the processor's Service, and of everything else the chart makes. The processor's server certificate
# names it, as its one DNS name, and Envoy checks the certificate for it, so the two must agree.
name: paztport-processor

# The processor's image. It has no default tag: give one, or a digest.
image:
  repository: paztport-processor
  tag: ""
  # When set (sha256:...), the image is taken by this digest and the tag is ignored.
  digest: ""
  pullPolicy: IfNotPresent

# Secrets holding the registry's credentials, by name, if the image needs them.
imagePullSecrets: []

# The Gateway the routes attach to, in the release's namespace, and the namespace its Envoy pods run in (Envoy
# Gateway's own, unless it deploys Envoy in the Gateway's namespace). The NetworkPolicy admits that Gateway's Envoy
# pods, and no other pod, to the processor's gRPC port: by default it selects them by the labels Envoy Gateway gives
# a Gateway's own Envoy pods. envoyPodLabels, when set, replaces those labels: with merged gateways
# (mergeGateways), Envoy Gateway labels Envoy's pods with the GatewayClass only
# (gateway.envoyproxy.io/owning-gatewayclass), and every Gateway of the class shares them. name is required unless
# envoyPodLabels is set.
gateway:
  name: ""
  envoyNamespace: envoy-gateway-system
  envoyPodLabels: {}

# The HTTPRoutes, in the release's namespace, that the edge stamps for, each with its receiver: the policy's name of
# the service its requests go to. The processor stamps a request for the receiver its route maps to, and for nothing
# a client sent. The policy must hold a proof of edge/<receiver> for each one, or the processor does not start.
# There is no default: the chart refuses to install without at least one, for example
#   routes:
#     - httpRoute: orders
#       receiver: orders
routes: []

# Further HTTPRoutes the processor is attached to that `routes` does not map. It refuses every request on them with
# its own 403, so a route can be attached before it is mapped and never reach its backend unstamped.
extraRoutes: []

# The most bytes of request body the edge stamps. Envoy buffers the whole body before the processor stamps it, so
# the same number must be the routes' request buffer limit; a longer body is refused (413), and never reaches its
# backend. A whole number of bytes, from 1 to 1073741824 (1 GiB), such as 1048576: not a quantity such as 1Mi.
bodyLimit: 1048576

# When true, the chart sets that limit on the routes in routes and extraRoutes, and on no other route, with a
# BackendTrafficPolicy of its own (requestBuffer.limit, bodyLimit bytes). Envoy Gateway attaches one
# BackendTrafficPolicy to a route: of two on the same route, the older is attached and the newer is not accepted for
# that route (its status condition Accepted is False, with the reason Conflicted). So when the routes already have
# a BackendTrafficPolicy, set this false and give that one requestBuffer.limit equal to bodyLimit. A route with no
# request buffer has only the Gateway listener's buffer, 32 KiB by default: a longer body is refused (413), never
# passed on unstamped.
backendTrafficPolicy: true

# How that BackendTrafficPolicy combines with one on the routes' Gateway or listener (an operator's rate limits,
# timeouts, retries or circuit breakers). StrategicMerge (the default) or JSONMerge merge it into that policy: the
# routes keep every setting of the Gateway's and gain the request buffer, and Envoy Gateway marks the Gateway's
# policy Merged. Empty sets no mergeType: the chart's policy then replaces the Gateway's on these routes, which lose
# its settings, and Envoy Gateway marks the Gateway's policy Overridden.
backendTrafficPolicyMergeType: StrategicMerge

# How the processor's EnvoyExtensionPolicy, which targets the routes, combines with one on their Gateway or
# listener: empty (the default), the route's replaces the Gateway's, which Envoy Gateway then marks Overridden;
# StrategicMerge or JSONMerge merge the route's into it, keeping the Gateway's Wasm, Lua and dynamic modules, though
# a Gateway-wide ext_proc is still replaced (extProc is a list, and the chart sets it). See the README first.
mergeType: ""

# How long Envoy waits for each of the processor's answers. It waits for the request's whole body first, so this
# bounds the stamping, not the upload; a processor that does not answer in time is a refusal (500).
messageTimeout: 500ms

# The edge's Paztport material. The edge's private key is a Secret: the chart makes one from `key`, or uses the
# Secret `existingKeySecret` names, which must hold it as edge.key. The rest is public and goes in a ConfigMap:
# the pinned policy key, the keyrings and roots (lists, so that an old and a new one can overlap during a rollover)
# and the edge's proof bundle. Pass the files with --set-file, for example
#   --set-file material.pin=out/keys/policy.pub --set-file 'material.keyrings[0]=out/keys/keyring.json'
material:
  existingKeySecret: ""
  key: ""
  pin: ""
  keyrings: []
  roots: []
  bundle: ""

# The processor's TLS. Its server certificate (DNS name `name`) and key are a Secret: the chart makes one from
# `cert` and `key`, or uses the kubernetes.io/tls Secret `existingSecret` names. `ca` is the mesh CA: the processor
# requires Envoy's client certificate to chain to it, and Envoy checks the processor's certificate against it. The
# chart puts it in a ConfigMap as ca.crt, or uses the ConfigMap `existingCAConfigMap` names, which must hold it so.
tls:
  existingSecret: ""
  cert: ""
  key: ""
  existingCAConfigMap: ""
  ca: ""

# The processor's replicas when autoscaling is off.
replicas: 2

# A HorizontalPodAutoscaler on CPU. It needs the cluster's resource metrics (metrics-server); without them it keeps
# minReplicas.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# With autoscaling off and replicas 1, minAvailable 1 blocks every voluntary disruption, a node drain included.
podDisruptionBudget:
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

# How long a stopping pod keeps serving before the processor begins to drain, so that Envoy stops sending it new
# requests first. The processor then lets the requests in flight finish for up to 10 s.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

# Prometheus's scrape annotations on the processor's pods: /metrics on the admin port.
scrapeAnnotations: true

# Further annotations on the processor's pods, such as a reloader's, which rolls them when a Secret or ConfigMap
# they mount changes (the processor reads its files once, at start).
podAnnotations: {}

# Where the processor's pods run. Each is the pod spec's field of the same name, set only when given; with two or
# more replicas, a topologySpreadConstraints across zones keeps the edge up through a zone's loss.
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

# Who may reach the admin port (/metrics, /readyz, /livez): NetworkPolicy peers, or anyone when empty.
adminFrom: []
