{{- /*
Copyright 2026 The Paztport Authors
SPDX-License-Identifier: Apache-2.0

Attaches the processor to the routes, and has Envoy reach it over mutual TLS. When every route has attach false
and extraRoutes is empty, there is nothing to attach to, and the chart makes no EnvoyExtensionPolicy (the
BackendTLSPolicy stays).

The filter fails closed (failOpen: false): a processor that fails or is unreachable is a refusal (500), and one that
does not answer within messageTimeout is answered 504 by Envoy itself. It sends the request's headers with the matched
route's metadata, from which the processor names the HTTPRoute, and buffers the whole body before sending it. It sends
the response's headers, and not its body, so that the processor can remove every Paztport header from the response. It
allows mode overrides: the processor's answer to headers that a body follows asks for the request's trailers too
(restating these same body and response modes), so that a request ending in trailers with no body reaches the processor,
and is refused, rather than going on unstamped. There are no header mutation rules: the processor must be able to remove
and set every Paztport header.

With mergeType empty, this policy on the routes replaces one on their Gateway or listener for those routes (Envoy
Gateway marks that one Overridden); StrategicMerge or JSONMerge merge this one into it instead.

Envoy also checks each processor replica itself, with the standard gRPC health check on the same port (the whole
server, no service named), over the same mutual TLS as the requests. Kubernetes readiness cannot see a replica whose
answers are slow only on Envoy's path to it, and outlier detection probably does not count an ext_proc answer that
misses messageTimeout; a replica that fails its check is left out of Envoy's endpoints.

Envoy checks the processor's certificate against the mesh CA, for the Service's name, and presents the edge's
client certificate, the EnvoyProxy's backendTLS setting.
*/ -}}
{{- if include "edge.attached" . }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  targetRefs:
    {{- range (include "edge.attached" . | splitList "\n") }}
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ . }}
    {{- end }}
  {{- with .Values.mergeType }}
  mergeType: {{ . }}
  {{- end }}
  extProc:
    - backendRefs:
        - name: {{ .Values.name }}
          port: 9002
      failOpen: false
      messageTimeout: {{ .Values.messageTimeout }}
      backendSettings:
        healthCheck:
          active:
            type: GRPC
            timeout: {{ .Values.healthCheck.timeout | default .Values.messageTimeout }}
            interval: {{ .Values.healthCheck.interval }}
            unhealthyThreshold: {{ include "edge.whole" .Values.healthCheck.unhealthyThreshold }}
            healthyThreshold: {{ include "edge.whole" .Values.healthCheck.healthyThreshold }}
      processingMode:
        allowModeOverride: true
        request:
          body: Buffered
          attributes:
            - xds.route_metadata
        response: {}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Values.name }}
  validation:
    hostname: {{ .Values.name }}
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: {{ include "edge.caConfigMap" . }}
