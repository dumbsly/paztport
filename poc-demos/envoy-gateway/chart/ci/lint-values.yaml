#
# Placeholder files, so that helm lint and helm template render every object; nothing here is a real key or
# certificate. A second routes entry and an extra route exercise the lists; the chart's own BackendTrafficPolicy
# carries the body limit.
image:
  tag: dev
gateway:
  name: edge
material:
  key: placeholder-edge-key
  pin: placeholder-policy-pub
  keyrings: ['{"placeholder":"keyring"}', '{"placeholder":"keyring.next"}']
  roots: ['{"placeholder":"root"}']
  bundle: '{"placeholder":"proofs-edge"}'
tls:
  cert: placeholder-cert
  key: placeholder-key
  ca: placeholder-ca
routes:
  - httpRoute: orders
    receiver: orders
  - httpRoute: payment
    receiver: payment
extraRoutes: [orders-unmapped]
