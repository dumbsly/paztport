# A backstop for waits a test does not bound itself. The starter's own calls end at their timeouts, the pooled
# client's read timeout (30 s unless a test sets it) among them, but a test's own latch, future or server thread has
# no such bound, and a regression in the starter's could bring the old wait for ever back. Past this, JUnit
# interrupts the test thread, which ends a JDK client's wait, so a stall fails one test instead of hanging the run.
# Every test and lifecycle method here takes a few seconds at most.
junit.jupiter.execution.timeout.default = 60 s
