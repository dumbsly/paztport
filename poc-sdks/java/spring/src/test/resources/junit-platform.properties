# A backstop for waits a test does not bound itself. The starter's own calls end at their timeouts, the pooled
# client's read timeout (30 s unless a test sets it) among them, but not every wait does: a body that stalls after
# its headers on the pooled client's request factory waits for ever on JDK 21, and a test's own latch or server
# thread can too. Past this, JUnit interrupts the test thread, which ends a JDK client's wait, so a stall fails one
# test instead of hanging the run. Every test and lifecycle method here takes well under a second.
junit.jupiter.execution.timeout.default = 60 s
