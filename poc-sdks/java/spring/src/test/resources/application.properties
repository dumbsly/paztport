# Every embedded server in these tests listens on the loopback address alone. Bound to the wildcard, a server could
# be handed a port that another process already holds on 127.0.0.1, since both sockets allow address reuse; a call to
# localhost then reaches that process instead, and gets a stray answer or, from one that never replies, none at all.
server.address=127.0.0.1
