server:
  port: 8080

path-attest:
  service-name: payment
  verify: true
  mode: ${PATH_ATTEST_MODE:enforce}
  capture: ${PA_CAPTURE:false}
  keyring-path: ${PA_KEYRING_PATH:/config/keys/keyring.json}
  root-path: ${PA_ROOT_PATH:/config/policy/root.json}
  max-age-ms: ${PATH_ATTEST_MAX_AGE_MS:5000}
  origins: ${PATH_ATTEST_ORIGINS:gateway}
  responder-url: ${RESPONDER_URL:}
